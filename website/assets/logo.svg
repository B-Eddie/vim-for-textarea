<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background - dark rounded square -->
  <rect x="0" y="0" width="200" height="200" rx="24" fill="#1a1a2e" />
  <rect x="6" y="6" width="188" height="188" rx="20" fill="#16213e" />
  
  <!-- Terminal-style border -->
  <rect x="16" y="16" width="168" height="168" rx="12" fill="none" stroke="#0f3460" stroke-width="2" />
  
  <!-- Cursor/caret -->
  <rect x="30" y="40" width="3" height="24" rx="1" fill="#00d4ff">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite" />
  </rect>
  
  <!-- Vim "V" letter - prominent -->
  <text x="100" y="125" text-anchor="middle" font-family="monospace" font-weight="bold" font-size="80" fill="#00d4ff">V</text>
  
  <!-- Text lines below -->
  <rect x="40" y="148" width="50" height="4" rx="2" fill="#0f3460" />
  <rect x="40" y="158" width="70" height="4" rx="2" fill="#0f3460" />
  <rect x="40" y="168" width="35" height="4" rx="2" fill="#0f3460" />
</svg>
